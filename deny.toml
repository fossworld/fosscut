# Dependency policy for cargo-deny (ADR-0014).
# Run locally with: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every exception names the advisory, why it does not affect FossCut and when to remove it.
ignore = [
    # `paste` is archived (unmaintained), with no known vulnerability. It is a compile-time
    # macro pulled in only by `rsmpeg`, our FFmpeg bindings (ADR-0009). Remove this entry
    # when rsmpeg drops `paste`.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time macro used only by rsmpeg; no known vulnerability" },
    # `ttf-parser` is unmaintained, with no known vulnerability. `fontdb` (through
    # `cosmic-text`) uses it to read font metadata, and FossCut only ever parses its four
    # bundled, checksummed Inter fonts, never system or user fonts. Remove this entry when
    # cosmic-text drops it; revisit before FossCut loads user-supplied fonts.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained font parser that only reads FossCut's bundled fonts; no known vulnerability" },
    # `proc-macro-error` is unmaintained, with no known vulnerability. It is a compile-time
    # macro helper of `glib-macros`, part of the GTK 3 bindings Tauri uses for windows and
    # menus on Linux (ADR-0010). Remove this entry when Tauri moves to newer GTK bindings.
    { id = "RUSTSEC-2024-0370", reason = "unmaintained compile-time macro helper in Tauri's Linux GTK bindings; no known vulnerability" },
    # `zvariant`, `zbus_names` and `zvariant_derive` are no longer published as standalone
    # crates (their code moved into `zbus`), with no known vulnerability. They come only
    # through `notify-rust`, which `tauri-plugin-notification` uses to show desktop
    # notifications over D-Bus on Linux (ADR-0031 item 6). Remove these entries when
    # notify-rust moves to a zbus release without them.
    { id = "RUSTSEC-2026-0370", reason = "zvariant folded into zbus; used only for Linux desktop notifications; no known vulnerability" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names folded into zbus; used only for Linux desktop notifications; no known vulnerability" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive folded into zbus; used only for Linux desktop notifications; no known vulnerability" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    # A public-domain dedication like CC0, for the whisper.cpp bindings (ADR-0014, ADR-0020).
    "Unlicense",
    # Public-domain-equivalent, for dependencies of the Windows pipe server (ADR-0014, ADR-0022).
    "0BSD",
]
# GPL, AGPL, SSPL and non-commercial licenses are not allowed in distributed builds.
# LGPL native libraries (FFmpeg) are linked dynamically at runtime and are not crates.

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
