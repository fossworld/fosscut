<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="fosscut:composition" content="width=1080, height=780, fps=30, duration=3.9">
<title>App window</title>
<!--
  Made by FossCut for its library: a generic editing app window, a title bar, a media
  panel, a viewer showing a picture or video, and a timeline whose clips build in while
  the playhead runs. Every frame is a function of time, through window.fosscut.seek and
  the overlay kit. Free to use, also commercially.
-->
<link rel="stylesheet" href="kit/overlay.css">
<style>
  #card { left: 64px; top: 44px; width: 952px; }
  #bar .spacer { flex: 1; }
  #bar .button { height: 42px; padding: 0 20px; font-size: 20px; border-radius: 21px; }
  #body { position: relative; height: 416px; margin-top: 64px; }
  #side { position: absolute; left: 20px; top: 20px; width: 184px; }
  #side .label { font-size: 19px; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; margin: 2px 0 12px 4px; }
  .tile { position: relative; width: 184px; height: 104px; border-radius: 14px; overflow: hidden; margin-bottom: 14px; }
  .tile .media { border-radius: 14px; }
  #viewer { position: absolute; left: 224px; top: 20px; width: 708px; height: 398px; border-radius: 18px; overflow: hidden; background: var(--screen); }
  #viewer .media { border-radius: 18px; }
  #timecode { position: absolute; left: 16px; bottom: 14px; height: 38px; padding: 0 12px; border-radius: 10px; background: rgba(8, 10, 14, 0.66);
              color: #fff; font-size: 20px; font-weight: 700; display: flex; align-items: center; }
  #timeline { position: relative; height: 176px; margin: 18px 20px 20px; border-radius: 18px; background: var(--card-2); overflow: hidden; }
  #ruler { position: absolute; left: 0; right: 0; top: 0; height: 30px; }
  #ruler i { position: absolute; top: 12px; width: 2px; height: 10px; border-radius: 1px; background: var(--faint); opacity: 0.6; }
  #ruler i.major { top: 8px; height: 14px; opacity: 1; }
  .lane { position: absolute; left: 14px; right: 14px; height: 36px; }
  .clip { position: absolute; top: 0; bottom: 0; border-radius: 9px; overflow: hidden; transform-origin: 0 50%; }
  .clip.video { background: var(--accent); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.22); }
  .clip.video b { position: absolute; left: 0; top: 0; bottom: 0; width: 46px; background: rgba(255, 255, 255, 0.22); }
  .clip.title { background: #8B5CF6; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.22); }
  .clip.sound { background: #12B76A; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.22); }
  .clip.sound svg { position: absolute; inset: 4px 8px; width: calc(100% - 16px); height: 28px; }
  #playhead { position: absolute; top: 4px; bottom: 6px; width: 4px; margin-left: -2px; border-radius: 2px; background: var(--ink); }
  #playhead::before { content: ""; position: absolute; left: -8px; top: -2px; width: 20px; height: 14px; border-radius: 4px; background: var(--ink); }
</style>
<script src="kit/overlay.js"></script>
<script src="main.js" defer></script>
</head>
<body></body>
</html>
