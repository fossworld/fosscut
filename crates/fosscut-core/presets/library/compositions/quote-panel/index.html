<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="fosscut:composition" content="width=1080, height=760, fps=30, duration=3.9">
<title>Quote panel</title>
<!--
  Made by FossCut for its library: a quote panel, a large quotation mark, the quote revealed
  word by word with a phrase marked in the accent colour, and its author with an avatar
  and role. Every frame is a function of time, through window.fosscut.seek and the overlay
  kit. Free to use, also commercially.
-->
<link rel="stylesheet" href="kit/overlay.css">
<style>
  #card { left: 64px; top: 44px; width: 952px; padding: 46px 54px 44px; }
  #glyph { width: 74px; height: 62px; color: var(--accent); }
  #quote { margin-top: 22px; font-size: 50px; font-weight: 800; letter-spacing: -0.028em; line-height: 1.2; color: var(--ink); }
  #quote .w { display: inline-block; white-space: pre; position: relative; }
  #quote .w.hot { color: var(--accent-ink); }
  #quote .w .bg { position: absolute; left: -6px; right: -6px; top: 0.04em; bottom: -0.02em; border-radius: 10px; background: var(--accent); z-index: -1; transform-origin: 0 50%; }
  #quote .w.hot.joined .bg { right: -14px; }
  #quote .line { position: relative; z-index: 0; }
  #by { display: flex; align-items: center; gap: 18px; margin-top: 36px; }
  #by .avatar { width: 72px; height: 72px; font-size: 28px; }
  #author { font-size: 30px; font-weight: 800; letter-spacing: -0.015em; }
  #role { margin-top: 2px; font-size: 25px; color: var(--muted); }
</style>
<script src="kit/overlay.js"></script>
<script src="main.js" defer></script>
</head>
<body></body>
</html>
