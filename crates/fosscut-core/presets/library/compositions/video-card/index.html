<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="fosscut:composition" content="width=1080, height=860, fps=30, duration=3.9">
<title>Video card</title>
<!--
  Made by FossCut for its library: a generic video card, a thumbnail with a play button,
  its length and a watched bar, the channel's avatar, the title and a line of views and
  age. It pops in, the views count up and the watched bar fills. Every frame is a function
  of time, through window.fosscut.seek and the overlay kit. Free to use, also commercially.
-->
<link rel="stylesheet" href="kit/overlay.css">
<style>
  #card { left: 64px; top: 44px; width: 952px; padding: 20px 20px 30px; }
  #thumb { position: relative; width: 912px; height: 513px; border-radius: 24px; overflow: hidden; }
  #thumb .media { border-radius: 24px; }
  #shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 62%, rgba(0,0,0,0.28) 100%); }
  #play { position: absolute; left: 50%; top: 50%; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%;
          background: rgba(255, 255, 255, 0.94); color: var(--accent); display: flex; align-items: center; justify-content: center;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25); }
  #play svg { margin-left: 6px; }
  #ring { position: absolute; left: 50%; top: 50%; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%;
          border: 4px solid rgba(255, 255, 255, 0.9); }
  #length { position: absolute; right: 18px; bottom: 26px; height: 44px; padding: 0 14px; border-radius: 12px; background: rgba(8, 10, 14, 0.78);
            color: #fff; font-size: 24px; font-weight: 700; display: flex; align-items: center; }
  #track { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: rgba(255, 255, 255, 0.35); }
  #watched { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: var(--accent); transform-origin: 0 50%; }
  #info { position: relative; margin: 28px 6px 0; display: flex; gap: 22px; align-items: flex-start; }
  #info .avatar { width: 76px; height: 76px; font-size: 30px; }
  #text { flex: 1; min-width: 0; }
  #title { font-size: 38px; color: var(--ink); }
  #meta { margin-top: 12px; font-size: 27px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #meta b { font-weight: 700; color: var(--ink-2); }
</style>
<script src="kit/overlay.js"></script>
<script src="main.js" defer></script>
</head>
<body></body>
</html>
