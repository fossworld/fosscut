<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="fosscut:composition" content="width=760, height=280, fps=30, duration=3.4">
<title>Audio chip</title>
<!--
  Made by FossCut for its library: a microphone chip, a pill with a microphone, a label,
  a recording dot with a running timer and a live waveform. Every frame is a function of
  time, through window.fosscut.seek and the overlay kit. Free to use, also commercially.
-->
<link rel="stylesheet" href="kit/overlay.css">
<style>
  #chip { left: 0; top: 56px; height: 140px; overflow: visible; border-radius: 70px; padding: 22px 40px 22px 22px; display: flex; align-items: center; gap: 24px; transform-origin: 70px 50%; }
  #mic { width: 96px; height: 96px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; flex: none; position: relative; }
  #halo { position: absolute; inset: -10px; border-radius: 50%; border: 4px solid var(--accent); }
  #words { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  #label { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
  #status { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  #rec { width: 14px; height: 14px; border-radius: 50%; background: var(--bad); }
  #wave { display: flex; align-items: center; gap: 6px; height: 84px; flex: none; }
  #wave i { display: block; width: 7px; border-radius: 4px; background: var(--accent); }
</style>
<script src="kit/overlay.js"></script>
<script src="main.js" defer></script>
</head>
<body></body>
</html>
