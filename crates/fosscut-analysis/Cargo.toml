[package]
name = "fosscut-analysis"
description = "FossCut's local media analysis: loudness, silences and scene cuts, cached by content (ADR-0012, ADR-0019)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["speech", "onnx"]
# Speech recognition with whisper.cpp (ADR-0020); needs CMake and a C++ compiler to build.
speech = ["dep:whisper-rs"]
# Vision and voice models on ONNX Runtime (ADR-0033), loaded at run time from an installed
# library; nothing native is needed to build it. Translation also normalizes Unicode text.
onnx = ["dep:ort", "dep:unicode-normalization"]

[dependencies]
blake3.workspace = true
fosscut-media = { workspace = true, features = ["ffmpeg"] }
fosscut-model.workspace = true
fosscut-time.workspace = true
ort = { workspace = true, optional = true }
rustfft.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicode-normalization = { workspace = true, optional = true }
whisper-rs = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { workspace = true, optional = true, features = ["metal"] }
ort = { workspace = true, optional = true, features = ["coreml"] }

[target.'cfg(windows)'.dependencies]
ort = { workspace = true, optional = true, features = ["directml"] }

[lints]
workspace = true
