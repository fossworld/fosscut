[package]
name = "fosscut-cli"
description = "The fosscut command-line interface: every editing command with JSON output for people and AI agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "fosscut"
path = "src/main.rs"

[dependencies]
clap.workspace = true
fosscut-core.workspace = true
fosscut-engine.workspace = true
fosscut-mcp.workspace = true
fosscut-model.workspace = true
fosscut-render.workspace = true
fosscut-time.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
base64.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
tokio = { workspace = true, features = ["macros"] }
fosscut-media = { workspace = true, features = ["ffmpeg"] }
fosscut-render.workspace = true
fosscut-time.workspace = true
insta.workspace = true

[lints]
workspace = true
