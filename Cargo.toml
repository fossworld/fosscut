[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Throwaway prototypes are their own workspaces, outside the tests and coverage gates.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fossworld/fosscut"
authors = ["The FossCut Contributors"]

[workspace.dependencies]
fosscut-time = { path = "crates/fosscut-time", version = "0.1.0" }
fosscut-model = { path = "crates/fosscut-model", version = "0.1.0" }
fosscut-core = { path = "crates/fosscut-core", version = "0.1.0" }
# Without the FFmpeg backend by default, so portable crates can use the media types.
fosscut-media = { path = "crates/fosscut-media", version = "0.1.0", default-features = false }
fosscut-render = { path = "crates/fosscut-render", version = "0.1.0" }

anyhow = "1.0.104"
blake3 = "1.8.7"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
half = "2.7.1"
insta = { version = "1.49.0", features = ["json"] }
png = "0.18.1"
pollster = "1.0.1"
proptest = "1.12.0"
# MIT-licensed FFmpeg 8 bindings, linked against system FFmpeg shared libraries (ADR-0009).
rsmpeg = { version = "0.18.0", default-features = false, features = ["ffmpeg8", "link_system_ffmpeg"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
wgpu = "30.0.1"

[workspace.lints.rust]
# Crates that must never use unsafe code add `#![forbid(unsafe_code)]`; only backend modules
# of fosscut-media and fosscut-render may allow it, with a `// SAFETY:` comment (ADR-0003).
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
# An ignored test must say why (`#[ignore = "reason"]`), so skipped tests stay visible in review.
ignore_without_reason = "warn"
