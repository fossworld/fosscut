[workspace]
resolver = "3"
members = ["crates/*", "xtask", "apps/desktop"]
# Throwaway prototypes are their own workspaces, outside the tests and coverage gates.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fossworld/fosscut"
authors = ["The FossCut Contributors"]

[workspace.dependencies]
fosscut-time = { path = "crates/fosscut-time", version = "0.1.0" }
fosscut-model = { path = "crates/fosscut-model", version = "0.1.0" }
fosscut-core = { path = "crates/fosscut-core", version = "0.1.0" }
# Without the FFmpeg backend by default, so portable crates can use the media types.
fosscut-media = { path = "crates/fosscut-media", version = "0.1.0", default-features = false }
fosscut-render = { path = "crates/fosscut-render", version = "0.1.0" }
fosscut-audio = { path = "crates/fosscut-audio", version = "0.1.0" }
fosscut-analysis = { path = "crates/fosscut-analysis", version = "0.1.0" }
fosscut-engine = { path = "crates/fosscut-engine", version = "0.1.0" }
fosscut-mcp = { path = "crates/fosscut-mcp", version = "0.1.0" }

anyhow = "1.0.104"
base64 = "0.23.1"
blake3 = "1.8.7"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
# Text shaping, layout and rasterization; system font discovery (fontconfig) is off so only
# bundled fonts are used.
# Audio output for preview playback in the desktop app (ADR-0008, item 5).
cpal = "0.18.2"
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
# Operating-system randomness for live session keys and nonces (ADR-0022).
getrandom = "0.4.3"
# 3D objects (ADR-0040): glTF 2.0 models with their buffers and PNG or JPEG images (gltf,
# MIT OR Apache-2.0; its `import` feature decodes images with the image crate), and polygon
# triangulation for extruded text and paths (earcut, MIT OR Apache-2.0, a port of Mapbox's
# ISC-licensed earcut).
earcut = "0.4.11"
gltf = { version = "1.4.1", default-features = false, features = ["import", "utils"] }
half = "2.7.1"
insta = { version = "1.49.0", features = ["json"] }
# Windows named-pipe server with an owner-only access list for live sessions (ADR-0022).
interprocess = { version = "2.4.7", default-features = false }
# ONNX Runtime bindings (MIT OR Apache-2.0) for local vision and voice models (ADR-0033).
# `load-dynamic` opens Microsoft's ONNX Runtime library (MIT) at run time, the way FFmpeg is
# linked dynamically (ADR-0009), so nothing is downloaded at build time; `api-22` accepts
# ONNX Runtime 1.22 and later.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-22"] }
png = "0.18.1"
pollster = "1.0.1"
proptest = "1.12.0"
# The official MCP SDK (Apache-2.0): the server, its tool macros and the stdio transport
# (ADR-0002). Tests add the client and child-process features.
rmcp = { version = "3.8.0", default-features = false, features = ["server", "macros", "transport-io"] }
# MIT-licensed FFmpeg 8 bindings, linked against system FFmpeg shared libraries (ADR-0009).
# The effective user id, to refuse runtime directories owned by someone else (ADR-0022).
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }
rsmpeg = { version = "0.18.0", default-features = false, features = ["ffmpeg8", "link_system_ffmpeg"] }
# Pure-Rust FFT (MIT OR Apache-2.0) for the spectral denoiser in fosscut-audio.
rustfft = "6.4.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: numbers read back from JSON (caches, records) equal what was written.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.10.9"
# The desktop shell (ADR-0010): Tauri 2 on the system webview, with native file dialogs.
tauri = "2.12.5"
tauri-build = "2.7.4"
tauri-plugin-dialog = "2.8.3"
thiserror = "2.0.21"
# Wide strings for the Windows pipe access list (ADR-0022).
widestring = "1.2.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
# Unicode NFKC (MIT OR Apache-2.0) for text before the translation models' tokenizer (ADR-0033).
unicode-normalization = "0.1.26"
wgpu = "30.0.1"
# whisper.cpp (MIT) built from source with CMake: local speech recognition (ADR-0020).
whisper-rs = { version = "0.16.0", default-features = false }
# Vector paths, strokes and SVG (ADR-0036): 2D curves with arc lengths and SVG path data
# (kurbo, MIT OR Apache-2.0), antialiased path fills and strokes (tiny-skia, BSD-3-Clause),
# and SVG parsing and rendering (usvg and resvg, MIT OR Apache-2.0). Without their default
# features: no system fonts, no text, no embedded raster images.
kurbo = "0.13.1"
resvg = { version = "0.49.0", default-features = false }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
usvg = { version = "0.49.0", default-features = false }

[workspace.lints.rust]
# Crates that must never use unsafe code add `#![forbid(unsafe_code)]`; only backend modules
# of fosscut-media and fosscut-render may allow it, with a `// SAFETY:` comment (ADR-0003).
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
# An ignored test must say why (`#[ignore = "reason"]`), so skipped tests stay visible in review.
ignore_without_reason = "warn"

# whisper.cpp (ADR-0020) asks CMake for an optimised build, but the Visual Studio generator
# takes its configuration from the cmake crate, which follows this opt-level: at 0, tests on
# Windows ran unoptimised speech recognition past their time limit. Optimising the package
# builds it as RelWithDebInfo on every platform.
[profile.dev.package.whisper-rs-sys]
opt-level = 3
