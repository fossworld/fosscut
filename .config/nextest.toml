# cargo-nextest configuration (ADR-0016). CI runs `cargo nextest run --profile ci`.

[profile.default]
# Report tests that hang instead of waiting forever.
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
# Run every test so one failure does not hide others. Never retry: a flaky test is a bug to fix,
# not a failure to hide.
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 5 }

# The milestone exit checks render, encode and verify a full 1080p, 240-frame export. On the
# Windows CI runner (WARP software GPU, Media Foundation's software H.264 encoder) each takes
# about 4.5 minutes, so they run one at a time and may take up to 10 minutes each.
[test-groups]
exit-checks = { max-threads = 1 }

[[profile.default.overrides]]
filter = "test(round_one_baseline_exports_and_verifies) | test(an_agent_reproduces_the_baseline_through_mcp_alone)"
test-group = "exit-checks"
slow-timeout = { period = "120s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = "test(round_one_baseline_exports_and_verifies) | test(an_agent_reproduces_the_baseline_through_mcp_alone)"
test-group = "exit-checks"
slow-timeout = { period = "120s", terminate-after = 5 }
