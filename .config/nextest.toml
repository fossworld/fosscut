# cargo-nextest configuration (ADR-0016). CI runs `cargo nextest run --profile ci`.

[profile.default]
# Report tests that hang instead of waiting forever.
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
# Run every test so one failure does not hide others. Never retry: a flaky test is a bug to fix,
# not a failure to hide.
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 5 }
