name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build a draft release for
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  detect:
    name: Detect release parts
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.detect.outputs.cli }}
      desktop: ${{ steps.detect.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - id: detect
        run: |
          echo "cli=$([ -f crates/fosscut-cli/Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "desktop=$([ -f scripts/release/desktop_bundle.py ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build-cli:
    name: Build fosscut CLI (${{ matrix.target }})
    needs: detect
    if: needs.detect.outputs.cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Rust toolchain and target
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # Bump to start fresh caches when a build input cargo does not track changes,
          # such as GGML_NATIVE in .cargo/config.toml.
          prefix-key: v1-rust
      # fosscut-media links FFmpeg 8 dynamically (ADR-0009); the archive ships an LGPL build
      # of it, with ffprobe for importing.
      - uses: ./.github/actions/setup-release-ffmpeg
      - name: Build
        shell: bash
        run: |
          # Find the shipped FFmpeg libraries in lib/ beside the binary.
          case "${{ runner.os }}" in
            # DT_RPATH rather than DT_RUNPATH, so libraries that only other FFmpeg libraries
            # need (libavfilter, through libavdevice) are found there too.
            Linux) export RUSTFLAGS="-C link-args=-Wl,--disable-new-dtags,-rpath,\$ORIGIN/lib" ;;
            macOS) export RUSTFLAGS="-C link-args=-Wl,-rpath,@executable_path/lib" ;;
          esac
          cargo build --release --locked -p fosscut-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="fosscut-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp LICENSE-MIT LICENSE-APACHE README.md "dist/$name/"
          ffmpeg_notice() {
            cat > "dist/$name/FFMPEG-NOTICE.txt" <<NOTICE
          This archive includes FFmpeg 8 shared libraries and ffprobe, $1, licensed under the
          GNU Lesser General Public License 2.1 or later; see FFMPEG-LICENSE.txt. FFmpeg's
          source code is at https://ffmpeg.org/download.html. FossCut links the libraries
          dynamically: you may replace them with your own build of the same version.
          NOTICE
          }
          btbn="from the LGPL builds of https://github.com/BtbN/FFmpeg-Builds"
          source="built from FFmpeg's 8.1 source release by scripts/release/build-ffmpeg-macos.sh in https://github.com/fossworld/fosscut"
          cp "$FFMPEG_RELEASE_DIR/LICENSE.txt" "dist/$name/FFMPEG-LICENSE.txt"
          case "${{ runner.os }}" in
            Windows)
              cp "target/${{ matrix.target }}/release/fosscut.exe" "dist/$name/"
              cp "$FFMPEG_RELEASE_DIR"/bin/*.dll "$FFMPEG_RELEASE_DIR/bin/ffprobe.exe" "dist/$name/"
              ffmpeg_notice "$btbn"
              "dist/$name/fosscut.exe" export --presets > /dev/null
              "dist/$name/ffprobe.exe" -version > /dev/null
              (cd dist && 7z a "$name.zip" "$name" > /dev/null && sha256sum "$name.zip" > "$name.zip.sha256")
              ;;
            Linux)
              command -v patchelf > /dev/null || sudo apt-get install -y --no-install-recommends patchelf
              cp "target/${{ matrix.target }}/release/fosscut" "dist/$name/"
              mkdir -p "dist/$name/lib"
              cp -P "$FFMPEG_RELEASE_DIR"/lib/*.so* "dist/$name/lib/"
              cp "$FFMPEG_RELEASE_DIR/bin/ffprobe" "dist/$name/"
              patchelf --set-rpath '$ORIGIN/lib' "dist/$name/ffprobe"
              ffmpeg_notice "$btbn"
              # The package runs on its own libraries.
              env -u LD_LIBRARY_PATH "dist/$name/fosscut" export --presets > /dev/null
              env -u LD_LIBRARY_PATH "dist/$name/ffprobe" -version > /dev/null
              (cd dist && tar czf "$name.tar.gz" "$name" && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
              ;;
            macOS)
              cp "target/${{ matrix.target }}/release/fosscut" "dist/$name/"
              mkdir -p "dist/$name/lib"
              # The names the binary asks for, such as libavcodec.62.dylib.
              for library in "$FFMPEG_RELEASE_DIR"/lib/lib*.dylib; do
                if [[ "$(basename "$library")" =~ ^lib[a-z]+\.[0-9]+\.dylib$ ]]; then
                  cp -L "$library" "dist/$name/lib/"
                fi
              done
              cp "$FFMPEG_RELEASE_DIR/bin/ffprobe" "dist/$name/"
              ffmpeg_notice "$source"
              # The package runs on its own libraries, never Homebrew's.
              if otool -L "dist/$name/fosscut" | grep -q /opt/homebrew; then
                echo "fosscut links Homebrew libraries" >&2
                exit 1
              fi
              env -i PATH=/usr/bin:/bin "dist/$name/fosscut" export --presets > /dev/null
              env -i PATH=/usr/bin:/bin "dist/$name/ffprobe" -version > /dev/null
              (cd dist && tar czf "$name.tar.gz" "$name" && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
              ;;
          esac
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@v7
        with:
          name: fosscut-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  build-desktop:
    name: Build FossCut desktop (${{ matrix.target }})
    needs: detect
    if: needs.detect.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Rust toolchain and target
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}
          prefix-key: v1-rust
      - uses: ./.github/actions/setup-release-ffmpeg
      - uses: ./.github/actions/setup-desktop
      - name: patchelf (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends patchelf
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: ui/package.json
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Build the UI
        run: |
          pnpm install --frozen-lockfile --dir ui
          pnpm --dir ui run build
      - name: Bundle settings
        shell: bash
        run: |
          python3 -I scripts/release/desktop_bundle.py ${{ matrix.platform }} "$FFMPEG_RELEASE_DIR" "$RUNNER_TEMP/bundle.json"
      - name: Build and bundle
        shell: bash
        working-directory: apps/desktop
        run: |
          case "${{ matrix.platform }}" in
            # The Debian package installs the FFmpeg libraries in /usr/lib/fosscut (DT_RPATH, so
            # it also serves libraries that other FFmpeg libraries need).
            linux) export RUSTFLAGS="-C link-args=-Wl,--disable-new-dtags,-rpath,/usr/lib/fosscut" ;;
            # The app carries them in Contents/Frameworks.
            macos) export RUSTFLAGS="-C link-args=-Wl,-rpath,@executable_path/../Frameworks" ;;
          esac
          cargo tauri build --target ${{ matrix.target }} --config "$RUNNER_TEMP/bundle.json"
      - name: Check the bundle carries FFmpeg
        shell: bash
        run: |
          out="target/${{ matrix.target }}/release/bundle"
          case "${{ matrix.platform }}" in
            macos)
              app=$(ls -d "$out"/macos/*.app)
              if otool -L "$app/Contents/MacOS/fosscut-desktop" | grep -q /opt/homebrew; then
                echo "the app links Homebrew libraries" >&2
                exit 1
              fi
              ls "$app/Contents/Frameworks/libavcodec.62.dylib"
              env -i PATH=/usr/bin:/bin "$app/Contents/MacOS/ffprobe" -version > /dev/null
              ;;
            linux)
              unpacked="$RUNNER_TEMP/deb"
              dpkg-deb -x "$out"/deb/*.deb "$unpacked"
              env -u LD_LIBRARY_PATH "$unpacked/usr/lib/fosscut/ffprobe" -version > /dev/null
              ls "$unpacked"/usr/lib/fosscut/libavcodec.so.*
              readelf -d "$unpacked/usr/bin/fosscut-desktop" | grep -E '\(RPATH\).*/usr/lib/fosscut'
              # Every library the app needs is in the package or on the system.
              missing=$(env -u LD_LIBRARY_PATH LD_LIBRARY_PATH="$unpacked/usr/lib/fosscut" \
                ldd "$unpacked/usr/bin/fosscut-desktop" | grep "not found" || true)
              if [ -n "$missing" ]; then
                echo "$missing" >&2
                exit 1
              fi
              ;;
          esac
      - name: Package
        shell: bash
        run: |
          out="target/${{ matrix.target }}/release/bundle"
          mkdir -p dist
          base="fosscut-desktop-${RELEASE_TAG}-${{ matrix.target }}"
          case "${{ matrix.platform }}" in
            windows) cp "$out"/nsis/*.exe "dist/$base-setup.exe" ;;
            linux) cp "$out"/deb/*.deb "dist/$base.deb" ;;
            macos) cp "$out"/dmg/*.dmg "dist/$base.dmg" ;;
          esac
          sum="sha256sum"
          if ! command -v sha256sum > /dev/null; then sum="shasum -a 256"; fi
          (cd dist && for f in *; do $sum "$f" > "$f.sha256"; done)
      - uses: actions/upload-artifact@v7
        with:
          name: fosscut-desktop-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft GitHub release
    needs: [detect, build-cli, build-desktop]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Generate release notes
        id: notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Download CLI archives and desktop installers
        uses: actions/download-artifact@v8
        with:
          pattern: fosscut-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          body_path: RELEASE_NOTES.md
          files: dist/*
