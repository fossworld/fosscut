name: Dependency advisories

# License and source policy is enforced on every pull request by the CI workflow. Security
# advisories are reported here instead, weekly and when dependencies change, so that a newly
# published advisory does not block unrelated pull requests.

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - deny.toml
  pull_request:
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - deny.toml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny-advisories:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for a Rust workspace
        id: detect
        run: echo "rust=$([ -f Cargo.lock ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.rust == 'true'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
          arguments: --all-features
