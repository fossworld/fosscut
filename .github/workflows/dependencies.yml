name: Dependencies

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - deny.toml
      - ui/package.json
      - ui/pnpm-lock.yaml
      - scripts/check-npm-licenses.mjs
  pull_request:
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - deny.toml
      - ui/package.json
      - ui/pnpm-lock.yaml
      - scripts/check-npm-licenses.mjs
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect project parts
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      ui: ${{ steps.detect.outputs.ui }}
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: |
          echo "rust=$([ -f Cargo.lock ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "ui=$([ -f ui/pnpm-lock.yaml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  cargo-deny:
    name: cargo-deny ${{ matrix.checks }}
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    # New advisories must not block unrelated pull requests; they surface in the weekly run.
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
          arguments: --all-features

  npm-licenses:
    name: npm license policy
    needs: detect
    if: needs.detect.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: ui/package.json
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: node scripts/check-npm-licenses.mjs ui
