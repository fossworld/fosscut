name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Linux and Windows tests and coverage run nightly and on demand, not on every pull
  # request, while desktop work focuses on macOS (ADR-0016, implementation notes).
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  detect:
    name: Detect project parts
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      ui: ${{ steps.detect.outputs.ui }}
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: |
          echo "rust=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "ui=$([ -f ui/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  docs:
    name: Docs and ADRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Keep competitor research private (ADR-0015)
        run: |
          tracked=$(git ls-files docs/capcut-audit docs/capcut-rea)
          if [ -n "$tracked" ]; then
            echo "::error::Private research must not be committed. Remove these files from the index with 'git rm --cached':"
            echo "$tracked"
            exit 1
          fi
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v25
      - name: Check local links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress './**/*.md'
          fail: true
      - name: Check ADR index
        run: python3 scripts/check-adr-index.py

  rust-lint:
    name: Rust format, lints and docs
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Bump to start fresh caches when a build input cargo does not track changes,
          # such as GGML_NATIVE in .cargo/config.toml.
          prefix-key: v1-rust
      - uses: ./.github/actions/setup-ffmpeg
      - uses: ./.github/actions/setup-desktop
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check generated JSON Schemas are up to date
        run: cargo xtask schemas --check

  rust-test:
    name: Rust tests (${{ matrix.os }})
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        # macOS on every run; Linux and Windows nightly and on demand.
        os: >-
          ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Bump to start fresh caches when a build input cargo does not track changes,
          # such as GGML_NATIVE in .cargo/config.toml.
          prefix-key: v1-rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: ./.github/actions/setup-ffmpeg
      - uses: ./.github/actions/setup-desktop
      - uses: ./.github/actions/setup-gpu
      - uses: ./.github/actions/setup-speech
      - uses: ./.github/actions/setup-models
      - name: Unit, property, contract, snapshot and end-to-end tests
        run: cargo nextest run --profile ci --workspace --all-features --locked --no-tests=fail
        env:
          # Tests that need FFmpeg fail instead of skipping (ADR-0016).
          FOSSCUT_REQUIRE_FFMPEG: "1"
      - name: Documentation tests
        run: cargo test --workspace --all-features --locked --doc

  coverage:
    name: Test coverage
    needs: detect
    # Nightly and on demand: the instrumented build and full test run take the longest.
    if: >-
      needs.detect.outputs.rust == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup component add llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          # Bump to start fresh caches when a build input cargo does not track changes,
          # such as GGML_NATIVE in .cargo/config.toml.
          prefix-key: v1-rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - uses: ./.github/actions/setup-ffmpeg
      - uses: ./.github/actions/setup-desktop
      - uses: ./.github/actions/setup-gpu
      - uses: ./.github/actions/setup-speech
      - uses: ./.github/actions/setup-models
      - name: Measure coverage and enforce the minimums in xtask/src/main.rs
        run: cargo xtask coverage
        env:
          NEXTEST_PROFILE: ci
          FOSSCUT_REQUIRE_FFMPEG: "1"
      - name: Upload the LCOV report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: target/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  dependency-policy:
    name: Dependency licenses and sources
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: cargo-deny bans, licenses and sources
        if: needs.detect.outputs.rust == 'true'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources
          arguments: --all-features
      - uses: pnpm/action-setup@v6
        if: needs.detect.outputs.ui == 'true'
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        if: needs.detect.outputs.ui == 'true'
        with:
          node-version-file: ui/package.json
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: npm license policy
        if: needs.detect.outputs.ui == 'true'
        run: |
          pnpm install --frozen-lockfile --dir ui
          node scripts/check-npm-licenses.mjs ui

  wasm-check:
    name: WebAssembly build of portable crates
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Bump to start fresh caches when a build input cargo does not track changes,
          # such as GGML_NATIVE in .cargo/config.toml.
          prefix-key: v1-rust
      - name: Build fosscut-time, fosscut-model and fosscut-core for wasm32
        run: |
          packages=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name')
          args=""
          for p in fosscut-time fosscut-model fosscut-core; do
            if echo "$packages" | grep -qx "$p"; then args="$args -p $p"; fi
          done
          if [ -z "$args" ]; then
            echo "::notice::No portable crates in the workspace yet (ADR-0003)."
            exit 0
          fi
          cargo build --locked --target wasm32-unknown-unknown $args

  ui:
    name: UI lint, types and tests
    needs: detect
    if: needs.detect.outputs.ui == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: ui/package.json
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --if-present lint
      - run: pnpm run --if-present typecheck
      - run: pnpm run --if-present test
      - run: pnpm run --if-present build

  # The one check that branch protection requires (docs/development/github-setup.md). It fails
  # when any job above failed or was cancelled, so adding a job here is enough to make it
  # required. Jobs skipped because a part of the project does not exist yet count as passing.
  ci-result:
    name: CI result
    if: always()
    needs: [detect, docs, rust-lint, rust-test, coverage, wasm-check, dependency-policy, ui]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::These CI jobs did not pass: $failed"
            exit 1
          fi
