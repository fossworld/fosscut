name: Set up the desktop app's system libraries
description: >
  Installs what Tauri needs to build the desktop app (ADR-0010). On Linux that is WebKitGTK 4.1
  with libsoup 3, GTK 3, librsvg and libxdo, as development packages. macOS and Windows need
  nothing more: their system webviews (WKWebView, WebView2) come with the runners.

runs:
  using: composite
  steps:
    - name: WebKitGTK, GTK and friends (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
          libgtk-3-dev librsvg2-dev libxdo-dev
