name: Set up the desktop app's system libraries
description: >
  Installs what the desktop app needs to build (ADR-0010). On Linux that is WebKitGTK 4.1 with
  libsoup 3, GTK 3, librsvg and libxdo for Tauri, and ALSA for preview sound, as development
  packages. macOS and Windows need nothing more: their webviews (WKWebView, WebView2) and
  sound systems come with the runners.

runs:
  using: composite
  steps:
    - name: WebKitGTK, GTK, ALSA and friends (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
          libgtk-3-dev librsvg2-dev libxdo-dev libasound2-dev
